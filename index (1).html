<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Know Thy Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE9DC; --paper2:#E6DFCF; --ink:#211D18; --ink-soft:#5B564A;
    --forest:#2F4A3C; --forest-dark:#213A2E; --mustard:#B9852A; --rust:#7A4A32;
    --line:#D8CFBC; --card:#F7F3E9;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1B1913; --paper2:#211E17; --ink:#EDE7D8; --ink-soft:#B3AC9A;
      --forest:#6FA789; --forest-dark:#4C7C64; --mustard:#E0A83E; --rust:#C08262;
      --line:#3A362A; --card:#242019;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B1913; --paper2:#211E17; --ink:#EDE7D8; --ink-soft:#B3AC9A;
    --forest:#6FA789; --forest-dark:#4C7C64; --mustard:#E0A83E; --rust:#C08262;
    --line:#3A362A; --card:#242019;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Noto Sans TC',system-ui,sans-serif; line-height:1.6;
    min-height:100%;
  }
  .wrap{max-width:640px; margin:0 auto; padding:2.2rem 1.25rem 4rem;}
  header{margin-bottom:1.6rem;}
  h1{
    font-family:'Noto Serif TC',Georgia,serif; font-weight:700;
    font-size:2rem; margin:0 0 .15rem; letter-spacing:-.01em;
  }
  .tag-title{font-family:'Noto Serif TC',Georgia,serif; font-weight:600; font-size:1.15rem; margin:.2rem 0 .6rem;}
  .tag{color:var(--ink-soft); font-size:.92rem; max-width:56ch; margin:0 0 .6rem;}
  .toolbar{
    display:flex; gap:.6rem; margin:1.4rem 0 1rem; align-items:center; flex-wrap:wrap;
  }
  .add-btn{
    margin-left:auto; background:var(--forest); color:var(--paper);
    border:none; border-radius:8px; padding:.55rem 1rem; font-size:.88rem;
    font-weight:600; cursor:pointer; font-family:'Noto Sans TC';
  }
  .add-btn:active{transform:translateY(1px);}

  .form-panel{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:1rem; margin-bottom:1.2rem; display:none;
  }
  .form-panel.open{display:block;}
  .form-panel label{display:block; font-size:.78rem; color:var(--ink-soft); margin:.5rem 0 .2rem;}
  .form-panel input, .form-panel select, .form-panel textarea{
    width:100%; padding:.5rem .6rem; border-radius:6px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink); font-family:'Noto Sans TC'; font-size:.92rem;
  }
  .form-panel textarea{resize:vertical; min-height:6.5em; line-height:1.55;}
  .form-actions{display:flex; gap:.5rem; margin-top:.9rem;}
  .save-btn{
    background:var(--forest); color:var(--paper); border:none; border-radius:6px;
    padding:.5rem 1rem; font-weight:600; cursor:pointer; font-family:'Noto Sans TC'; font-size:.88rem;
  }
  .cancel-btn{
    background:transparent; color:var(--ink-soft); border:1px solid var(--line); border-radius:6px;
    padding:.5rem 1rem; cursor:pointer; font-family:'Noto Sans TC'; font-size:.88rem;
  }
  .req{color:var(--rust);}

  .star-input{display:flex; gap:.15rem; margin-top:.35rem;}
  .star-input button{
    background:none; border:none; cursor:pointer; padding:0; font-size:1.6rem;
    color:var(--line); line-height:1; transition:color .15s;
  }
  .star-input button.filled{color:var(--mustard);}
  .scale-caption{
    display:flex; justify-content:space-between; font-size:.72rem; color:var(--ink-soft);
    margin-top:.3rem; max-width:11rem;
  }
  .scale-legend{font-size:.72rem; color:var(--ink-soft); margin-top:.3rem; line-height:1.5;}
  .save-btn:disabled, .join-btn:disabled{opacity:.45; cursor:not-allowed;}
  .scale-readout{font-size:.85rem; margin-top:.35rem; color:var(--ink-soft);}
  .scale-readout b{color:var(--ink);}

  .genre-pick-row{display:flex; gap:.4rem; align-items:center; margin-top:.4rem;}
  .genre-pick-row:first-child{margin-top:0;}
  .genre-pick-row select{flex:1;}
  .remove-genre-pick{
    background:transparent; border:1px solid var(--line); color:var(--ink-soft);
    border-radius:6px; width:2rem; height:2rem; flex-shrink:0; cursor:pointer;
    font-family:'Noto Sans TC'; font-size:.85rem;
  }
  .add-genre-pick-btn{
    background:transparent; border:1px dashed var(--line); color:var(--ink-soft);
    border-radius:6px; padding:.35rem .7rem; font-size:.78rem; cursor:pointer;
    font-family:'Noto Sans TC'; margin-top:.5rem;
  }
  .genre-add{display:none; gap:.5rem; margin-top:.5rem;}
  .genre-add.open{display:flex;}
  .genre-add input{flex:1;}
  .genre-add button{
    background:var(--forest); color:var(--paper); border:none; border-radius:6px;
    padding:0 .8rem; font-size:.85rem; font-weight:600; cursor:pointer; font-family:'Noto Sans TC';
  }
  .link-row{display:flex; gap:.5rem; margin-top:.3rem;}
  .link-row input{flex:1;}
  .add-link-btn{
    background:transparent; border:1px dashed var(--line); color:var(--ink-soft);
    border-radius:6px; padding:.35rem .7rem; font-size:.78rem; cursor:pointer;
    font-family:'Noto Sans TC'; margin-top:.4rem;
  }

  .book-genre{
    font-size:.72rem; color:var(--ink-soft); border:1px solid var(--line); border-radius:999px;
    padding:.1rem .55rem; display:inline-block; margin-top:.35rem; margin-right:.3rem;
  }

  .book{
    display:flex; gap:.9rem; background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:.85rem .95rem; margin-bottom:.65rem;
    align-items:flex-start;
  }
  .spine{width:6px; align-self:stretch; border-radius:4px; flex-shrink:0;}
  .book-body{flex:1; min-width:0;}
  .book-top{display:flex; justify-content:space-between; gap:.6rem; align-items:baseline;}
  .book-title{font-family:'Noto Serif TC',serif; font-weight:600; font-size:1.08rem; margin:0;}
  .book-rating{font-size:1rem; white-space:nowrap; flex-shrink:0; display:flex; align-items:center; gap:.3rem;}
  .book-note{font-size:.85rem; color:var(--ink-soft); margin:.4rem 0 0; white-space:pre-wrap;}
  .book-link{font-size:.78rem; color:var(--forest); text-decoration:none; border-bottom:1px solid var(--line); display:inline-block; margin-top:.5rem;}
  .book-link:hover{border-color:var(--forest);}
  .remove-btn{
    background:none; border:none; color:var(--ink-soft); cursor:pointer;
    font-size:.75rem; padding:0; margin-top:.5rem; margin-right:.8rem; text-decoration:underline;
    font-family:'Noto Sans TC';
  }
  .empty{
    text-align:center; color:var(--ink-soft); padding:2.5rem 1rem; font-size:.92rem;
  }
  .note{font-size:.78rem; color:var(--ink-soft); margin-top:2rem; border-top:1px solid var(--line); padding-top:.9rem;}

  .tabs-row{display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:.7rem;}
  .tab-btn{
    border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
    border-radius:999px; padding:.3rem .8rem; font-size:.8rem; cursor:pointer;
    font-family:'Noto Sans TC';
  }
  .tab-btn.active{border-color:var(--mustard); color:var(--mustard); font-weight:600;}
  .sort-row{display:flex; gap:.4rem; margin-bottom:.9rem;}

  .book-links{display:flex; flex-direction:column; gap:.2rem; margin-top:.5rem;}
  .book-meta{font-size:.72rem; color:var(--ink-soft); margin-top:.3rem;}
  .admin-btn{
    background:transparent; border:1px solid var(--line); color:var(--ink-soft);
    border-radius:8px; padding:.35rem .7rem; font-size:.75rem; cursor:pointer;
    font-family:'Noto Sans TC';
  }
  .admin-btn.on{border-color:var(--rust); color:var(--rust);}

  .engage-row{display:flex; gap:.5rem; margin-top:.5rem; align-items:center;}
  .like-btn{
    background:transparent; border:1px solid var(--line); border-radius:999px;
    padding:.25rem .65rem; font-size:.8rem; cursor:pointer; color:var(--ink-soft);
    font-family:'Noto Sans TC'; display:inline-flex; gap:.3rem; align-items:center;
  }
  .like-btn.liked{border-color:var(--rust); color:var(--rust);}
  .reviews{margin-top:.7rem; padding-top:.6rem; border-top:1px dashed var(--line);}
  .reviews-head{font-size:.75rem; color:var(--ink-soft); margin:0 0 .5rem;}
  .review{padding:.6rem .7rem; border:1px solid var(--line); border-radius:8px; background:var(--paper); margin-bottom:.5rem;}
  .review.top{border-color:var(--mustard);}
  .review-head{display:flex; flex-wrap:wrap; gap:.4rem; align-items:center; font-size:.82rem;}
  .review-head b{color:var(--ink);}
  .review-stars{color:var(--mustard); font-size:.85rem;}
  .review-tag{font-size:.68rem; color:var(--mustard); border:1px solid var(--mustard); border-radius:999px; padding:0 .45rem;}
  .review-tag.admin{color:var(--rust); border-color:var(--rust);}
  .review-text{font-size:.85rem; color:var(--ink-soft); margin:.35rem 0 0; white-space:pre-wrap;}
  .review-actions{display:flex; gap:.7rem; align-items:center; margin-top:.4rem; flex-wrap:wrap;}
  .show-more-btn{background:none; border:none; color:var(--forest); cursor:pointer; font-size:.78rem; text-decoration:underline; padding:0; font-family:'Noto Sans TC'; margin-bottom:.4rem;}
  .composer{display:flex; flex-direction:column; gap:.4rem; padding:.7rem; border:1px dashed var(--line); border-radius:8px; margin-top:.4rem;}
  .composer input, .composer textarea{
    padding:.45rem .6rem; border-radius:6px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); font-family:'Noto Sans TC'; font-size:.88rem; resize:vertical; line-height:1.5;
  }
  .composer .star-input button{font-size:1.4rem;}
  .composer-label{font-size:.75rem; color:var(--ink-soft);}
  .join-btn{
    background:var(--forest); color:var(--paper); border:none; border-radius:8px;
    padding:.4rem .9rem; font-size:.8rem; font-weight:600; cursor:pointer; font-family:'Noto Sans TC'; margin-top:.3rem;
  }
  .dup-hint{font-size:.78rem; color:var(--forest); margin:.3rem 0 0; display:none;}
  .dup-hint.show{display:block;}
  .admin-btn.adm{border-color:var(--rust); color:var(--rust);}
  .gm-row{display:flex; gap:.6rem; align-items:center; margin:.4rem 0; font-size:.88rem;}
  .gm-row span{flex:1;}
  .status-note{font-size:.8rem; color:var(--rust); margin:.6rem 0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Know Thy Shelf</h1>
    <p class="tag-title" id="introTitle"></p>
    <div id="introBody"></div>
  </header>

  <div id="statusNote"></div>

  <div class="toolbar" id="filters">
    <button class="admin-btn adm" id="editIntroBtn" style="display:none">編輯簡介</button>
    <button class="admin-btn adm" id="manageGenresBtn" style="display:none">管理標籤</button>
    <button class="admin-btn adm" id="migrateBtn" style="display:none">整理舊資料</button>
    <button class="admin-btn" id="authBtn" title="登入後，你可以在不同裝置上編輯自己的留言">用 Google 登入</button>
    <button class="add-btn" id="openForm">+ 新增書籍</button>
  </div>

  <div class="tabs-row" id="genreTabs"></div>
  <div class="sort-row" id="sortRow">
    <button class="tab-btn active" data-sort="new">最新在前</button>
    <button class="tab-btn" data-sort="rating">評分高到低</button>
  </div>

  <div class="form-panel" id="formPanel">
    <label>書名 <span class="req">*</span></label>
    <input id="fTitle" placeholder="黑暗的左手">
    <p class="dup-hint" id="dupHint"></p>
    <label>連結（購買或閱讀地址，最多 2 個，選填）</label>
    <div class="link-row"><input id="fLink1" placeholder="https://bookshop.org/..."></div>
    <div class="link-row" id="link2Row" style="display:none;"><input id="fLink2" placeholder="第二個連結"></div>
    <button type="button" class="add-link-btn" id="addLinkBtn">+ 新增第二個連結</button>
    <label>標籤 <span class="req">*</span>（可複選）</label>
    <div id="genrePicks"></div>
    <button type="button" class="add-genre-pick-btn" id="addGenreQtyBtn">+ 再選一個標籤</button>
    <div class="genre-add" id="genreAddRow">
      <input id="fNewGenre" placeholder="新標籤名稱">
      <button type="button" id="addGenreBtn">新增</button>
    </div>
    <div id="reviewFields">
      <label>暱稱（顯示在你的評論上）</label>
      <input id="fNickname" placeholder="你的暱稱">
      <label>喜歡（或不喜歡）它的理由（選填）</label>
      <textarea id="fNote" rows="5" placeholder="讓人慾罷不能 / 完全看不下去"></textarea>
      <label>你的評分 <span class="req">*</span></label>
      <div class="star-input" id="fRatingInput"></div>
      <p class="scale-readout" id="ratingReadoutWrap" style="display:none"><b id="ratingReadout"></b></p>
    </div>
    <div class="form-actions">
      <button class="save-btn" id="saveBook">新增書籍</button>
      <button class="cancel-btn" id="cancelForm">取消</button>
    </div>
  </div>

  <div class="form-panel" id="introPanel">
    <label>簡介標題</label>
    <input id="introTitleInput">
    <label>簡介內文（空一行 = 新段落）</label>
    <textarea id="introBodyInput" rows="9"></textarea>
    <div class="form-actions">
      <button class="save-btn" id="saveIntro">儲存簡介</button>
      <button class="cancel-btn" id="cancelIntro">取消</button>
    </div>
  </div>

  <div class="form-panel" id="genrePanel">
    <label>標籤管理（改名會同步更新所有書；刪除會從所有書移除該標籤）</label>
    <div id="genreManageList"></div>
    <button class="cancel-btn" id="closeGenrePanel" style="margin-top:.7rem">關閉</button>
  </div>

  <div id="list"></div>
  <p class="note" id="permNote">所有打開這個連結的人都能即時共享這個書架。</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, collectionGroup, doc, setDoc, updateDoc, deleteDoc,
  onSnapshot, writeBatch, arrayUnion, arrayRemove, deleteField
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged, GoogleAuthProvider, linkWithPopup, signInWithCredential, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCIsUX8N3qhEQSJgJnziG2J5l1b-pgN_rw",
  authDomain: "know-thy-shelf-8753a.firebaseapp.com",
  databaseURL: "https://know-thy-shelf-8753a-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "know-thy-shelf-8753a",
  storageBucket: "know-thy-shelf-8753a.firebasestorage.app",
  messagingSenderId: "1089382956803",
  appId: "1:1089382956803:web:ec5dd3b610653bc5fe7336"
};
const firebaseApp = initializeApp(firebaseConfig);
const fdb = getFirestore(firebaseApp);
const auth = getAuth(firebaseApp);

const SPINE_COLORS = ["#2F4A3C","#B9852A","#7A4A32","#5B7B9A","#8A5A7A"];
const TAG_GROUPS = {
  "體裁與形式": ["科幻","懸疑/推理","奇幻","文學小說","輕小說","歷史小說","傳記","歷史","哲學","科普","心理學","社會學","投資理財","自我成長","商業管理","語言學習","食譜烹飪","實體書","電子書","有聲書","漫畫/圖文書"],
  "主題與概念": ["時間管理","思維模型","習慣養成","情緒管理","被動收入","美股","房地產","價值投資","加密貨幣","極簡主義","收納整理","咖啡/茶","手作烘焙"],
  "氛圍與體驗": ["治癒系","燒腦","暗黑","溫馨","搞笑幽默","輕鬆易讀","硬核學術","入門必看","引人入勝","慢熱","短篇合集"],
  "來源與情境": ["朋友推薦","書單推介","得獎作品","工作需要","睡前讀物","旅行隨身","送禮用"]
};
const DEFAULT_GENRES = Object.values(TAG_GROUPS).flat();
function tagGroupLabel(g){
  for (const [label, list] of Object.entries(TAG_GROUPS)) if (list.includes(g)) return label;
  return "自訂標籤";
}
// Builds <optgroup> sections in a fixed order, so the picker stays readable with 50+ tags.
function groupedTagOptionsHtml(selectedVal){
  const customs = genres.filter(g => !DEFAULT_GENRES.includes(g));
  const groups = {...TAG_GROUPS, "自訂標籤": customs};
  let html = "";
  for (const [label, list] of Object.entries(groups)){
    const present = list.filter(g => genres.includes(g));
    if (!present.length) continue;
    html += `<optgroup label="${escapeHtml(label)}">` +
      present.map(g => `<option value="${escapeHtml(g)}" ${g === selectedVal ? "selected" : ""}>${escapeHtml(g)}</option>`).join("") +
      `</optgroup>`;
  }
  return html;
}
const REVIEWS_COLLAPSED = 3;

function spineColor(title){
  title = String(title || "");
  let h = 0;
  for (let i=0;i<title.length;i++){ h = (h*31 + title.charCodeAt(i)) >>> 0; }
  return SPINE_COLORS[h % SPINE_COLORS.length];
}
function starsDisplay(n){ n = Math.max(0, Math.min(5, Math.round(n||0))); return "★".repeat(n) + "☆".repeat(5-n); }
const RATING_LABELS = {1:"浪費時間", 2:"差強人意", 3:"不過不失", 4:"深受啟發", 5:"必讀之作"};
function ratingReadout(n){
  return RATING_LABELS[n] ? n + " 星：" + RATING_LABELS[n] : "";
}
function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function bookGenres(b){
  if (Array.isArray(b.genres) && b.genres.length) return b.genres;
  if (Array.isArray(b.genre) && b.genre.length) return b.genre;
  if (b.genre) return [b.genre];
  return [];
}
function normTitle(t){
  return String(t||"").toLowerCase().replace(/[\s·・:：\-—_'"“”「」『』《》()（）]/g, "");
}

// ---------- state ----------
let books = [];
let reviewsByBook = {};           // bookId -> [review docs from books/{id}/reviews]
let genres = DEFAULT_GENRES.slice();
let genresMissing = false;
let myUid = null;
let myNickname = localStorage.getItem("shelfNickname") || "";
let sortMode = "new";
let activeGenre = "全部";
let composerOpen = new Set();
let showAllReviews = new Set();
let editingBookId = null;
let editingReview = null;         // {bid}
let drafts = {};
let genrePickValues = [];
let pendingNewGenreIndex = null;

const ADMIN_EMAILS = ["cktkrystal@gmail.com", "knowthyshelfhk@gmail.com"];   // UI only — the real check is in the Firestore rules
const isAdmin = () => !!(myUser && !myUser.isAnonymous && ADMIN_EMAILS.includes((myUser.email || "").toLowerCase()));

const DEFAULT_INTRO = {
  title: "一個屬於我哋嘅廣東話 Goodreads 📚",
  body: "有時想搵本書睇，書店網站嘅留言一係冇人寫，一係就太官方客套；外國網站又未必啱我哋嘅閱讀口味。\n\n成立呢個小角落，純粹想喺呢個同溫層入面，同大家用最自在嘅廣東話，交流最直白嘅讀後感。無論你正走過 25–35 歲的迷茫與成長，還是對這個階段的人生體會有所共鳴，都歡迎留低你嘅真實評價——好書一齊推，爛書一齊避！"
};
let intro = {...DEFAULT_INTRO};
function renderIntro(){
  document.getElementById("introTitle").textContent = intro.title;
  document.getElementById("introBody").innerHTML = String(intro.body || "").split(/\n\s*\n/)
    .filter(p => p.trim()).map(p => `<p class="tag">${escapeHtml(p.trim()).replace(/\n/g, "<br>")}</p>`).join("");
}

function showStatus(msg){
  document.getElementById("statusNote").innerHTML = msg ? `<p class="status-note">${escapeHtml(msg)}</p>` : "";
}
function needLogin(){
  if (myUid) return false;
  showStatus("還沒連上登入服務，請稍等一下或重新整理頁面再試。");
  return true;
}

// ---------- reviews model ----------
// Live reviews are documents at books/{bookId}/reviews/{uid}  (one per person, protected by security rules).
// Older data that was stored inside the book document itself is still shown (read-only).
function legacyReviews(b){
  const out = [];
  if (Array.isArray(b.reviews)){
    b.reviews.forEach(r => out.push({...r, legacy:true, likes:r.likes||0}));
  } else {
    if (b.rating || b.note){
      out.push({id:"legacy-main", nickname:b.nickname||"", rating:b.rating||0, text:b.note||"", likes:b.likes||0, at:b.addedAt||0, legacy:true});
    }
    (Array.isArray(b.comments) ? b.comments : []).forEach((c,i) => {
      out.push({id:"legacy-c"+i, nickname:c.nickname||"", rating:0, text:c.text||"", likes:0, at:c.at||0, legacy:true});
    });
  }
  return out;
}
function getReviews(b){ return [...legacyReviews(b), ...(reviewsByBook[b.id] || [])]; }
const likeCount = r => r.legacy ? (r.likes||0) : (Array.isArray(r.likedBy) ? r.likedBy.length : 0);
const isOwnReview = r => !!(myUid && !r.legacy && r.authorUid === myUid);
const isOwnBook = b => !!(myUid && b.creatorUid && b.creatorUid === myUid);
function sortReviews(rs){ return rs.slice().sort((a,b) => likeCount(b)-likeCount(a) || (a.at||0)-(b.at||0)); }
function avgRating(rs){
  const rated = rs.filter(r => r.rating > 0);
  return rated.length ? rated.reduce((s,r) => s + r.rating, 0) / rated.length : 0;
}
const reviewRef = (bid) => doc(fdb, "books", bid, "reviews", myUid);
const reviewData = (nickname, rating, text) => ({authorUid: myUid, nickname, rating, text, likedBy: [], at: Date.now()});

// ---------- auth ----------
// Everyone starts as an anonymous visitor (can post, like, edit their own things on this browser).
// "用 Google 登入" upgrades that same anonymous identity to a Google-linked one, so nothing they already
// posted is lost and they can edit it from any device.
const googleProvider = new GoogleAuthProvider();
const authBtn = document.getElementById("authBtn");
let myUser = null;

function paintAuthBtn(){
  const signedIn = !!(myUser && !myUser.isAnonymous);
  authBtn.classList.toggle("on", signedIn);
  authBtn.textContent = signedIn ? `已登入：${myUser.displayName || myUser.email || "Google"} · 登出` : "用 Google 登入";
  paintAdminTools();
}
function paintAdminTools(){
  const adm = isAdmin();
  document.getElementById("fNote").placeholder = "讓人慾罷不能 / 完全看不下去" + (adm ? "\n可換行，按 Enter 或 Shift+Enter 皆可" : "");
  document.getElementById("editIntroBtn").style.display = adm ? "inline-block" : "none";
  document.getElementById("manageGenresBtn").style.display = adm ? "inline-block" : "none";
  document.getElementById("migrateBtn").style.display = (adm && books.some(b => legacyReviews(b).length)) ? "inline-block" : "none";
  if (!adm){
    document.getElementById("introPanel").classList.remove("open");
    document.getElementById("genrePanel").classList.remove("open");
  }
}
onAuthStateChanged(auth, (user) => {
  if (!user){
    signInAnonymously(auth).catch(err => {
      console.error(err);
      showStatus("登入服務未啟用：你可以瀏覽，但暫時不能發表、按讚或編輯。（管理員請到 Firebase 啟用「匿名」登入）");
    });
    return;
  }
  myUser = user; myUid = user.uid;
  paintAuthBtn(); trySeedGenres(); render();
});
authBtn.addEventListener("click", async () => {
  if (myUser && !myUser.isAnonymous){
    if (!confirm("登出後會變回匿名身份，之後要再登入同一個 Google 帳戶，才能編輯你之前發表的內容。確定登出嗎？")) return;
    myUid = null; myUser = null;
    await signOut(auth);      // listener above creates a fresh anonymous visitor
    paintAuthBtn(); render();
    return;
  }
  if (!auth.currentUser){ showStatus("還沒連上登入服務，請稍等一下再試。"); return; }
  try{
    await linkWithPopup(auth.currentUser, googleProvider);   // same uid, now tied to your Google account
    myUser = auth.currentUser; myUid = myUser.uid;
    await myUser.getIdToken(true);   // refresh so the security rules can see your email
    showStatus("");
    paintAuthBtn(); render();
  }catch(err){
    if (err.code === "auth/credential-already-in-use" || err.code === "auth/email-already-in-use"){
      const cred = GoogleAuthProvider.credentialFromError(err);
      if (cred && confirm("這個 Google 帳戶之前已經用過。要切換到那個帳戶嗎？\n（你在這個瀏覽器上、登入前以匿名身份發表的內容，之後將無法再由你編輯。）")){
        try{ await signInWithCredential(auth, cred); }catch(e2){ console.error(e2); showStatus("切換帳戶失敗：" + e2.message); }
      }
    } else if (err.code === "auth/popup-closed-by-user" || err.code === "auth/cancelled-popup-request"){
      // user closed the window — nothing to do
    } else if (err.code === "auth/unauthorized-domain"){
      showStatus("這個網址還沒加入 Firebase 的「授權網域」，Google 登入暫時不能使用。（管理員請到 Authentication → Settings → Authorized domains 新增）");
    } else {
      console.error(err);
      showStatus("Google 登入失敗：" + err.message + "（如果登入視窗被擋住，請改用 Safari 或 Chrome 開啟）");
    }
  }
});

function composerHtml(key, {submitAttr, cancelAttr, submitLabel}){
  const d = drafts[key];
  return `
  <div class="composer">
    <span class="composer-label">你的暱稱</span>
    <input data-draft="${key}" data-field="nick" value="${escapeHtml(d.nick)}" placeholder="暱稱">
    <span class="composer-label">評分 <span class="req">*</span>${isAdmin() ? "（再點一次同一顆星可清除）" : ""}</span>
    <div class="star-input">${[1,2,3,4,5].map(v => `<button type="button" class="${v <= d.rating ? "filled" : ""}" data-draft-star="${key}" data-v="${v}">★</button>`).join("")}</div>
    ${d.rating ? `<span class="composer-label">${escapeHtml(ratingReadout(d.rating))}</span>` : ""}
    <textarea rows="5" data-draft="${key}" data-field="text" placeholder="你為什麼喜歡（或不喜歡）它？${isAdmin() ? "可換行" : ""}">${escapeHtml(d.text)}</textarea>
    <div class="review-actions">
      <button type="button" class="join-btn" ${submitAttr} ${(!d.rating && !isAdmin()) ? "disabled" : ""}>${submitLabel}</button>
      <button type="button" class="remove-btn" ${cancelAttr}>取消</button>
    </div>
  </div>`;
}

function reviewHtml(b, r, idx, total){
  const own = isOwnReview(r);
  const canModify = !r.legacy && (own || isAdmin());
  const asAdmin = isAdmin() && !own;
  const n = likeCount(r);
  const liked = !r.legacy && myUid && Array.isArray(r.likedBy) && r.likedBy.includes(myUid);
  const isTop = idx === 0 && total > 1 && n > 0;
  if (editingReview && editingReview.bid === b.id && editingReview.uid === r.id && drafts["e:"+b.id+":"+r.id]){
    return `<div class="review">${composerHtml("e:"+b.id+":"+r.id, {
      submitAttr: `data-save-review="${b.id}" data-uid="${escapeHtml(r.id)}"`, cancelAttr: `data-cancel-edit="1"`, submitLabel: "儲存變更"
    })}</div>`;
  }
  return `
  <div class="review ${isTop ? "top" : ""}">
    <div class="review-head">
      <b>${escapeHtml(r.nickname || "匿名")}</b>
      ${r.rating ? `<span class="review-stars">${starsDisplay(r.rating)}</span>` : ""}
      ${isTop ? `<span class="review-tag">👑 最多人覺得有用</span>` : ""}
      ${r.editedByAdmin ? `<span class="review-tag admin">管理者已編輯</span>` : ""}
    </div>
    ${r.text ? `<p class="review-text">${escapeHtml(r.text)}</p>` : ""}
    <div class="review-actions">
      ${r.legacy
        ? `<span class="like-btn" style="cursor:default">❤ ${n}</span>`
        : `<button class="like-btn ${liked ? "liked" : ""}" data-like="${b.id}" data-uid="${escapeHtml(r.id)}">${liked ? "❤" : "🤍"} <span>${n}</span></button>`}
      ${canModify ? `<button class="remove-btn" style="margin:0" data-edit-review="${b.id}" data-uid="${escapeHtml(r.id)}">${asAdmin ? "編輯（管理者）" : "編輯"}</button>
      <button class="remove-btn" style="margin:0" data-del-review="${b.id}" data-uid="${escapeHtml(r.id)}">${asAdmin ? "刪除（管理者）" : "刪除我的評論"}</button>` : ""}
    </div>
  </div>`;
}

// ---------- book list ----------
function render(){
  const list = document.getElementById("list");
  let items = books.slice();
  if (activeGenre !== "全部") items = items.filter(b => bookGenres(b).includes(activeGenre));
  items.sort((a,b) => sortMode === "rating"
    ? avgRating(getReviews(b)) - avgRating(getReviews(a)) || (b.addedAt||0) - (a.addedAt||0)
    : (b.addedAt||0) - (a.addedAt||0));

  if (items.length === 0){
    list.innerHTML = `<div class="empty">這裡還沒有書，新增第一本推薦給朋友們吧。</div>`;
    return;
  }

  list.innerHTML = items.map(b => {
    try{
      const rs = getReviews(b);
      const sorted = sortReviews(rs);
      const ratedCount = rs.filter(r => r.rating > 0).length;
      const avg = avgRating(rs);
      const expanded = showAllReviews.has(b.id) || sorted.length <= REVIEWS_COLLAPSED;
      const visible = expanded ? sorted : sorted.slice(0, REVIEWS_COLLAPSED);
      const links = (Array.isArray(b.links) ? b.links : []).filter(l => l && /^https?:\/\//i.test(l.url || ""));
      const bgenres = bookGenres(b);
      const hasOwn = rs.some(isOwnReview);
      const composing = composerOpen.has(b.id);
      const ckey = "c:" + b.id;
      if (composing && !drafts[ckey]) drafts[ckey] = {nick: myNickname, rating: 0, text: ""};
      return `
      <div class="book" data-id="${b.id}">
        <div class="spine" style="background:${spineColor(b.title)}"></div>
        <div class="book-body">
          <div class="book-top">
            <p class="book-title">${escapeHtml(b.title)}</p>
            <span class="book-rating">${ratedCount ? `${starsDisplay(avg)} <span style="font-size:.75rem;color:var(--ink-soft)">${avg.toFixed(1)}（${ratedCount}）</span>` : `<span style="font-size:.75rem;color:var(--ink-soft)">尚無評分</span>`}</span>
          </div>
          ${bgenres.map(g => `<span class="book-genre">${escapeHtml(g)}</span>`).join("")}
          ${links.length ? `<div class="book-links">${links.map((l,i) => `<a class="book-link" href="${escapeHtml(l.url)}" target="_blank" rel="noopener">查看 / 購買${links.length>1 ? " " + (i+1) : ""}</a>`).join("")}</div>` : ""}

          <div class="reviews">
            <p class="reviews-head">${rs.length} 則評論${isAdmin() ? " · 按讚最多的排在最上面" : ""}</p>
            ${visible.length ? visible.map((r,i) => reviewHtml(b, r, i, sorted.length)).join("") : `<p class="reviews-head">還沒有評論，成為第一個吧。</p>`}
            ${!expanded ? `<button class="show-more-btn" data-toggle-reviews="${b.id}">顯示全部 ${sorted.length} 則評論</button>` : (sorted.length > REVIEWS_COLLAPSED ? `<button class="show-more-btn" data-toggle-reviews="${b.id}">收合</button>` : "")}
            ${composing ? composerHtml(ckey, {submitAttr:`data-submit-review="${b.id}"`, cancelAttr:`data-close-composer="${b.id}"`, submitLabel:"送出我的評論"})
              : (hasOwn ? "" : `<button class="join-btn" data-open-composer="${b.id}">＋ 我也讀過，寫下我的評分與評論</button>`)}
          </div>

          ${(isOwnBook(b) || isAdmin()) ? `<button class="remove-btn" data-edit-book="${b.id}">${isAdmin() && !isOwnBook(b) ? "編輯書籍資訊（管理者）" : "編輯書籍資訊"}</button>` : ""}
          ${isAdmin() ? `<button class="remove-btn" data-del-book="${b.id}">刪除整本書（管理者）</button>` : ""}
        </div>
      </div>`;
    }catch(err){
      console.error("這本書的資料格式有誤，無法正常顯示：", b.id, b, err);
      return `
      <div class="book" data-id="${b.id}">
        <div class="book-body">
          <p class="book-note">⚠️ 這筆資料格式有誤，暫時無法顯示（id: ${escapeHtml(b.id)}）。</p>
          <p class="book-meta">錯誤原因：${escapeHtml(err && err.message || err)}</p>
        </div>
      </div>`;
    }
  }).join("");
}

// Don't redraw the list under someone's typing when a live update arrives.
let renderPending = false;
function typingInList(){
  const a = document.activeElement;
  return !!(a && a.closest && a.closest("#list") && /^(TEXTAREA|INPUT)$/.test(a.tagName));
}
function safeRender(){ if (typingInList()){ renderPending = true; } else { render(); } }
document.getElementById("list").addEventListener("focusout", () => {
  setTimeout(() => { if (renderPending && !typingInList()){ renderPending = false; render(); } }, 0);
});

document.getElementById("list").addEventListener("input", (e) => {
  const el = e.target.closest("[data-draft]");
  if (!el) return;
  const d = drafts[el.dataset.draft];
  if (d) d[el.dataset.field] = el.value;
});

document.getElementById("list").addEventListener("click", async (e) => {
  const t = e.target;

  const st = t.closest("[data-draft-star]");
  if (st){
    const d = drafts[st.dataset.draftStar];
    const v = Number(st.dataset.v);
    if (d){ d.rating = d.rating === v ? 0 : v; render(); }
    return;
  }

  // like / unlike (one per person — stored as your uid in the review's likedBy list)
  const lk = t.closest("[data-like]");
  if (lk){
    if (needLogin()) return;
    const bid = lk.dataset.like, uid = lk.dataset.uid;
    const r = (reviewsByBook[bid] || []).find(x => x.id === uid);
    const already = !!(r && Array.isArray(r.likedBy) && r.likedBy.includes(myUid));
    try{
      await updateDoc(doc(fdb, "books", bid, "reviews", uid), {likedBy: already ? arrayRemove(myUid) : arrayUnion(myUid)});
    }catch(err){ console.error(err); showStatus("按讚失敗，請再試一次。"); }
    return;
  }

  const oc = t.closest("[data-open-composer]");
  if (oc){ composerOpen.add(oc.dataset.openComposer); render(); return; }
  const cc = t.closest("[data-close-composer]");
  if (cc){ composerOpen.delete(cc.dataset.closeComposer); delete drafts["c:" + cc.dataset.closeComposer]; render(); return; }

  // add my review to an existing book
  const sr = t.closest("[data-submit-review]");
  if (sr){
    if (needLogin()) return;
    const bid = sr.dataset.submitReview;
    const d = drafts["c:" + bid];
    if (!d) return;
    if (!d.rating){ alert("請先選擇評分。"); return; }
    const nick = d.nick.trim();
    if (nick){ myNickname = nick; localStorage.setItem("shelfNickname", nick); }
    try{
      await setDoc(reviewRef(bid), reviewData(nick, d.rating, d.text.trim()));
      composerOpen.delete(bid); delete drafts["c:" + bid];
      render();
    }catch(err){ console.error(err); showStatus("送出失敗，請再試一次。"); }
    return;
  }

  // edit / save / cancel a review (your own; the admin can do any)
  const er = t.closest("[data-edit-review]");
  if (er){
    const bid = er.dataset.editReview, uid = er.dataset.uid;
    const r = (reviewsByBook[bid] || []).find(x => x.id === uid);
    if (!r) return;
    editingReview = {bid, uid};
    drafts["e:" + bid + ":" + uid] = {nick: r.nickname || "", rating: r.rating || 0, text: r.text || ""};
    render();
    return;
  }
  if (t.closest("[data-cancel-edit]")){
    if (editingReview) delete drafts["e:" + editingReview.bid + ":" + editingReview.uid];
    editingReview = null; render(); return;
  }
  const sv = t.closest("[data-save-review]");
  if (sv){
    if (needLogin()) return;
    const bid = sv.dataset.saveReview, uid = sv.dataset.uid;
    const d = drafts["e:" + bid + ":" + uid];
    if (!d) return;
    if (!d.rating && !isAdmin()){ alert("評分不可為 0 星。"); return; }
    const extra = (isAdmin() && uid !== myUid) ? {editedByAdmin: true} : {};
    try{
      await updateDoc(doc(fdb, "books", bid, "reviews", uid), {nickname: d.nick.trim(), rating: d.rating, text: d.text.trim(), editedAt: Date.now(), ...extra});
      delete drafts["e:" + bid + ":" + uid];
      editingReview = null;
      render();
    }catch(err){ console.error(err); showStatus("儲存失敗，請再試一次。"); }
    return;
  }

  // delete a review
  const dr = t.closest("[data-del-review]");
  if (dr){
    if (needLogin()) return;
    const uid = dr.dataset.uid;
    if (!confirm(uid === myUid ? "確定要刪除你的這則評論嗎？" : "確定要刪除這則評論嗎？（管理者操作）")) return;
    try{ await deleteDoc(doc(fdb, "books", dr.dataset.delReview, "reviews", uid)); }
    catch(err){ console.error(err); showStatus("刪除失敗，請再試一次。"); }
    return;
  }

  // delete a whole book with all its reviews (admin)
  const dbk = t.closest("[data-del-book]");
  if (dbk){
    if (!isAdmin()) return;
    const bid = dbk.dataset.delBook;
    if (!confirm("確定要刪除整本書和它底下所有評論嗎？此動作無法復原。")) return;
    try{
      const batch = writeBatch(fdb);
      (reviewsByBook[bid] || []).forEach(r => batch.delete(doc(fdb, "books", bid, "reviews", r.id)));
      batch.delete(doc(fdb, "books", bid));
      await batch.commit();
    }catch(err){ console.error(err); showStatus("刪除失敗，請再試一次。"); }
    return;
  }

  const tg = t.closest("[data-toggle-reviews]");
  if (tg){
    const id = tg.dataset.toggleReviews;
    if (showAllReviews.has(id)) showAllReviews.delete(id); else showAllReviews.add(id);
    render();
    return;
  }

  const eb = t.closest("[data-edit-book]");
  if (eb){ const b = books.find(x => x.id === eb.dataset.editBook); if (b) startEditBook(b); return; }
});

function trySeedGenres(){
  if (genresMissing && myUid){
    genresMissing = false;
    setDoc(doc(fdb, "meta", "genres"), {items: DEFAULT_GENRES}).catch(()=>{});
  }
}

// ---------- add-book / edit-book form ----------
const formPanel = document.getElementById("formPanel");
const saveBtn = document.getElementById("saveBook");
const reviewFieldsEl = document.getElementById("reviewFields");
const dupHint = document.getElementById("dupHint");

function findDuplicate(title){
  const n = normTitle(title);
  return n ? books.find(b => normTitle(b.title) === n) : null;
}
document.getElementById("fTitle").addEventListener("input", (e) => {
  if (editingBookId) return;
  const dup = findDuplicate(e.target.value);
  dupHint.classList.toggle("show", !!dup);
  dupHint.textContent = dup ? `📚 書架上已經有《${dup.title}》了，你的評分與評論會加到它下面。` : "";
});

function resetForm(){
  editingBookId = null;
  document.getElementById("fTitle").value = "";
  document.getElementById("fNickname").value = myNickname;
  document.getElementById("fLink1").value = "";
  document.getElementById("fLink2").value = "";
  document.getElementById("link2Row").style.display = "none";
  document.getElementById("addLinkBtn").style.display = "inline-block";
  document.getElementById("fNote").value = "";
  reviewFieldsEl.style.display = "block";
  dupHint.classList.remove("show"); dupHint.textContent = "";
  currentRating = 0;
  paintScale(0);
  genrePickValues = [genres[0] || ""];
  renderGenrePicks();
  saveBtn.textContent = "新增書籍";
}

function startEditBook(book){
  editingBookId = book.id;
  paintScale(currentRating); // re-check the Save button's disabled state now that a rating isn't required
  document.getElementById("fTitle").value = book.title || "";
  const links = Array.isArray(book.links) ? book.links : [];
  document.getElementById("fLink1").value = links[0] ? links[0].url : "";
  document.getElementById("fLink2").value = links[1] ? links[1].url : "";
  document.getElementById("link2Row").style.display = links[1] ? "flex" : "none";
  document.getElementById("addLinkBtn").style.display = links[1] ? "none" : "inline-block";
  genrePickValues = bookGenres(book).length ? bookGenres(book) : [genres[0] || ""];
  renderGenrePicks();
  reviewFieldsEl.style.display = "none";
  dupHint.classList.remove("show");
  saveBtn.textContent = "儲存書籍資訊";
  formPanel.classList.add("open");
  formPanel.scrollIntoView({behavior:"smooth", block:"start"});
}

document.getElementById("addLinkBtn").addEventListener("click", (e) => {
  document.getElementById("link2Row").style.display = "flex";
  e.target.style.display = "none";
});
document.getElementById("openForm").addEventListener("click", () => { resetForm(); formPanel.classList.add("open"); });
document.getElementById("cancelForm").addEventListener("click", () => { formPanel.classList.remove("open"); resetForm(); });

saveBtn.addEventListener("click", async () => {
  if (needLogin()) return;
  const title = document.getElementById("fTitle").value.trim();
  const link1 = document.getElementById("fLink1").value.trim();
  const link2 = document.getElementById("fLink2").value.trim();
  const links = [link1, link2].filter(Boolean).map(url => ({url}));
  const genresChosen = [...new Set(genrePickValues.filter(g => g && g !== "__new__"))];

  try{
    if (editingBookId){
      if (!title || !genresChosen.length){ alert("書名和標籤為必填欄位。"); return; }
      await updateDoc(doc(fdb, "books", editingBookId), {title, links, genres: genresChosen});
    } else {
      const nickname = document.getElementById("fNickname").value.trim();
      const note = document.getElementById("fNote").value.trim();
      const rating = currentRating;
      if (!title || !genresChosen.length || !rating){ alert("書名、標籤、評分為必填欄位。"); return; }
      if (nickname){ myNickname = nickname; localStorage.setItem("shelfNickname", nickname); }
      const dup = findDuplicate(title);
      if (dup){
        if (getReviews(dup).some(isOwnReview)){ alert("你已經評論過這本書了，可以在書卡上編輯你自己的評論。"); return; }
        if (!confirm(`《${dup.title}》已經在書架上了。要把你的評分與評論加到這本書下面嗎？`)) return;
        await setDoc(reviewRef(dup.id), reviewData(nickname, rating, note));
      } else {
        const bref = doc(collection(fdb, "books"));
        const batch = writeBatch(fdb);
        batch.set(bref, {title, links, genres: genresChosen, nickname, creatorUid: myUid, addedAt: Date.now()});
        batch.set(doc(fdb, "books", bref.id, "reviews", myUid), reviewData(nickname, rating, note));
        await batch.commit();
      }
    }
    resetForm();
    formPanel.classList.remove("open");
  }catch(err){ console.error(err); showStatus("儲存失敗，請再試一次。"); }
});

document.getElementById("fNickname").value = myNickname;
resetForm();

// ---------- admin tools (only shown when signed in as the admin Google account) ----------
const introPanel = document.getElementById("introPanel");
const genrePanel = document.getElementById("genrePanel");
document.getElementById("editIntroBtn").addEventListener("click", () => {
  if (!isAdmin()) return;
  document.getElementById("introTitleInput").value = intro.title;
  document.getElementById("introBodyInput").value = intro.body;
  introPanel.classList.add("open");
  introPanel.scrollIntoView({behavior:"smooth", block:"start"});
});
document.getElementById("cancelIntro").addEventListener("click", () => introPanel.classList.remove("open"));
document.getElementById("saveIntro").addEventListener("click", async () => {
  if (!isAdmin()) return;
  const title = document.getElementById("introTitleInput").value.trim();
  const body = document.getElementById("introBodyInput").value.trim();
  try{
    await setDoc(doc(fdb, "meta", "intro"), {title, body});
    introPanel.classList.remove("open");
  }catch(err){ console.error(err); showStatus("儲存簡介失敗：" + err.message); }
});

function renderGenreManager(){
  const customs = genres.filter(g => !DEFAULT_GENRES.includes(g));
  const groups = {...TAG_GROUPS, "自訂標籤": customs};
  let html = "";
  for (const [label, list] of Object.entries(groups)){
    const present = genres.map((g,i) => ({g,i})).filter(x => list.includes(x.g));
    if (!present.length) continue;
    html += `<p class="composer-label" style="margin-top:.8rem">${escapeHtml(label)}</p>`;
    html += present.map(({g,i}) => {
      const n = books.filter(b => bookGenres(b).includes(g)).length;
      return `<div class="gm-row"><span>${escapeHtml(g)}（${n} 本）</span>
        <button class="remove-btn" style="margin:0" data-gm-rename="${i}">改名</button>
        <button class="remove-btn" style="margin:0" data-gm-del="${i}">刪除</button></div>`;
    }).join("");
  }
  document.getElementById("genreManageList").innerHTML = html;
}
document.getElementById("manageGenresBtn").addEventListener("click", () => {
  if (!isAdmin()) return;
  renderGenreManager();
  genrePanel.classList.add("open");
  genrePanel.scrollIntoView({behavior:"smooth", block:"start"});
});
document.getElementById("closeGenrePanel").addEventListener("click", () => genrePanel.classList.remove("open"));
document.getElementById("genreManageList").addEventListener("click", async (e) => {
  if (!isAdmin()) return;
  const rn = e.target.closest("[data-gm-rename]");
  const dl = e.target.closest("[data-gm-del]");
  try{
    if (rn){
      const old = genres[Number(rn.dataset.gmRename)];
      const nn = (prompt("新的標籤名稱：", old) || "").trim();
      if (!nn || nn === old) return;
      if (genres.includes(nn)){ alert("已經有這個標籤了。"); return; }
      const batch = writeBatch(fdb);
      batch.set(doc(fdb, "meta", "genres"), {items: genres.map(g => g === old ? nn : g)});
      books.filter(b => bookGenres(b).includes(old)).forEach(b => {
        const upd = {genres: bookGenres(b).map(g => g === old ? nn : g)};
        if (b.genre !== undefined) upd.genre = deleteField();
        batch.update(doc(fdb, "books", b.id), upd);
      });
      await batch.commit();
      if (activeGenre === old) activeGenre = nn;
    } else if (dl){
      const old = genres[Number(dl.dataset.gmDel)];
      const affected = books.filter(b => bookGenres(b).includes(old));
      if (!confirm(`刪除「${old}」？會從 ${affected.length} 本書移除這個標籤。`)) return;
      const batch = writeBatch(fdb);
      batch.set(doc(fdb, "meta", "genres"), {items: genres.filter(g => g !== old)});
      affected.forEach(b => {
        const upd = {genres: bookGenres(b).filter(g => g !== old)};
        if (b.genre !== undefined) upd.genre = deleteField();
        batch.update(doc(fdb, "books", b.id), upd);
      });
      await batch.commit();
      if (activeGenre === old) activeGenre = "全部";
    }
  }catch(err){ console.error(err); showStatus("標籤更新失敗：" + err.message); }
});

// One click: turn old-format reviews (stored inside the book document) into normal review documents,
// so the admin can edit / delete them like any other review.
document.getElementById("migrateBtn").addEventListener("click", async () => {
  if (!isAdmin()) return;
  const targets = books.filter(b => legacyReviews(b).length);
  if (!targets.length) return;
  if (!confirm(`把 ${targets.length} 本書的舊格式評論轉成新格式？轉換後就能像其他評論一樣編輯／刪除。`)) return;
  try{
    for (const b of targets){
      const batch = writeBatch(fdb);
      legacyReviews(b).forEach((r, i) => {
        const n = r.likes || 0;
        batch.set(doc(fdb, "books", b.id, "reviews", "legacy_" + i + "_" + Date.now().toString(36)), {
          authorUid: "legacy", nickname: r.nickname || "", rating: r.rating || 0, text: r.text || "",
          likedBy: Array.from({length: n}, (_, k) => "legacy-like-" + k), at: r.at || 0
        });
      });
      batch.update(doc(fdb, "books", b.id), {reviews: deleteField(), rating: deleteField(), note: deleteField(), likes: deleteField(), comments: deleteField()});
      await batch.commit();
    }
    showStatus("舊資料整理完成。");
    setTimeout(() => showStatus(""), 4000);
  }catch(err){ console.error(err); showStatus("整理失敗：" + err.message); }
});

// ---------- Firestore wiring ----------
function init(){
  onSnapshot(collection(fdb, "books"), (snap) => {
    books = snap.docs.map(d => ({id: d.id, ...d.data()}));
    safeRender();
    renderGenreTabs();
    paintAdminTools();
  }, (err) => { console.error(err); showStatus("讀取書架時發生問題：" + err.message); });

  onSnapshot(doc(fdb, "meta", "intro"), (snap) => {
    const d = snap.exists() ? snap.data() : null;
    intro = d ? {title: d.title != null ? d.title : DEFAULT_INTRO.title, body: d.body != null ? d.body : DEFAULT_INTRO.body} : {...DEFAULT_INTRO};
    renderIntro();
  }, (err) => console.error(err));

  onSnapshot(collectionGroup(fdb, "reviews"), (snap) => {
    const map = {};
    snap.docs.forEach(d => {
      const bid = d.ref.parent.parent && d.ref.parent.parent.id;
      if (!bid) return;
      (map[bid] = map[bid] || []).push({id: d.id, ...d.data()});
    });
    reviewsByBook = map;
    safeRender();
  }, (err) => { console.error(err); showStatus("讀取評論時發生問題：" + err.message); });

  onSnapshot(doc(fdb, "meta", "genres"), (snap) => {
    const data = snap.exists() ? snap.data() : null;
    const items = data && Array.isArray(data.items) ? data.items : null;
    if (items && items.length){ genres = items; }
    else { genresMissing = true; trySeedGenres(); }
    if (!genrePickValues.length) genrePickValues = [genres[0] || ""];
    renderGenrePicks();
    renderGenreTabs();
  }, (err) => { console.error(err); showStatus("讀取標籤清單時發生問題：" + err.message); });
}

renderIntro();
renderGenreTabs();
render();
init();
</script>
